name: release-phase3-tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release when running manually (for example: v0.1.0)"
        required: false
        type: string

concurrency:
  group: release-phase3-tag-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SWELL_ENABLE_UPDATER_ARTIFACTS: "false"

jobs:
  release-validate:
    name: release-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      release_version: ${{ steps.validate.outputs.release_version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "ERROR: No release tag resolved. Provide workflow input 'release_tag' or run from a v* tag push." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate tag, version, and changelog
        id: validate
        run: |
          python scripts/release/validate_release_inputs.py \
            --tag "${{ steps.resolve_tag.outputs.tag }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate release notes from changelog
        run: |
          mkdir -p _release
          python scripts/release/generate_release_notes.py \
            --tag "${{ steps.resolve_tag.outputs.tag }}" \
            --output _release/release_notes.md

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
          IS_PRERELEASE: ${{ steps.validate.outputs.is_prerelease }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "ERROR: Release $RELEASE_TAG is already published." >&2
              exit 1
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release edit "$RELEASE_TAG" \
                --title "$RELEASE_TAG" \
                --notes-file _release/release_notes.md \
                --draft \
                --prerelease
            else
              gh release edit "$RELEASE_TAG" \
                --title "$RELEASE_TAG" \
                --notes-file _release/release_notes.md \
                --draft \
                --prerelease=false
            fi
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release create "$RELEASE_TAG" \
                --title "$RELEASE_TAG" \
                --notes-file _release/release_notes.md \
                --draft \
                --prerelease \
                --verify-tag
            else
              gh release create "$RELEASE_TAG" \
                --title "$RELEASE_TAG" \
                --notes-file _release/release_notes.md \
                --draft \
                --verify-tag
            fi

  macos-arm64-package:
    name: macos-arm64-package
    runs-on: macos-14
    timeout-minutes: 45
    needs:
      - release-validate
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/release-py312-constraints.txt -e ".[dev]"
          python -m pip install -c requirements/release-py312-constraints.txt -e ".[model]"
          python -m pip install -c requirements/release-py312-constraints.txt pyinstaller

      - name: Run startup smoke test
        run: |
          OUT="$(python -m swell.main --smoke-test | tail -n 1)"
          test "$OUT" = "SMOKE_TEST:PASS"

      - name: Run model runtime smoke test
        run: |
          OUT="$(python scripts/release/run_model_smoke.py --require-runtime | tail -n 1)"
          test "$OUT" = "MODEL_SMOKE:PASS"

      - name: Build macOS arm64 app
        run: SWELL_SIGN_UPDATES="${{ env.SWELL_ENABLE_UPDATER_ARTIFACTS }}" PYTHON_BIN=python ./scripts/release/build_macos_app_arm64.sh

      - name: Run packaged app model runtime smoke test
        run: |
          OUT="$(dist/macos-arm64/Swell.app/Contents/MacOS/Swell --smoke-test --smoke-model-runtime | tail -n 1)"
          test "$OUT" = "SMOKE_TEST:PASS"

      - name: Run packaged app launch probe
        run: |
          OUT="$(python scripts/release/run_launch_probe.py --bundle-path dist/macos-arm64/Swell.app | tail -n 1)"
          test "$OUT" = "LAUNCH_PROBE:PASS"

      - name: Verify macOS arm64 outputs
        run: |
          test -d dist/macos-arm64/Swell.app
          test -f dist/swell-macos-arm64.zip
          if [ "${SWELL_ENABLE_UPDATER_ARTIFACTS}" = "true" ]; then
            test -f dist/swell-macos-arm64-signature.json
          fi

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-validate.outputs.release_tag }}
        shell: bash
        run: |
          FILES=(dist/swell-macos-arm64.zip)
          if [ "${SWELL_ENABLE_UPDATER_ARTIFACTS}" = "true" ]; then
            FILES+=(dist/swell-macos-arm64-signature.json)
          fi
          gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber

  windows-runtime-gate:
    name: windows-runtime-gate
    runs-on: windows-latest
    timeout-minutes: 45
    needs:
      - release-validate
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/release-py312-constraints.txt -e ".[dev]"
          python -m pip install -c requirements/release-py312-constraints.txt pytest build twine pyinstaller hydra-core
          python -m pip install -c requirements/release-py312-constraints.txt --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CPU-index torch install failed; retrying from default index..."
            python -m pip install -c requirements/release-py312-constraints.txt torch==2.10.0
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to install torch on Windows runner." }
          python -m pip install -c requirements/release-py312-constraints.txt "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"

      - name: Verify pytest install
        shell: pwsh
        run: |
          python -c "import pytest; print(pytest.__version__)"

      - name: Ensure NSIS is available
        if: env.SWELL_ENABLE_UPDATER_ARTIFACTS == 'true'
        shell: pwsh
        run: |
          if (!(Get-Command "makensis" -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          if (!(Get-Command "makensis" -ErrorAction SilentlyContinue)) {
            throw "makensis is required for release installer generation."
          }

      - name: Run test suite
        run: python -m pytest -q tests

      - name: Run startup smoke test
        shell: pwsh
        run: |
          $out = (python -m swell.main --smoke-test | Select-Object -Last 1)
          if ($out -ne "SMOKE_TEST:PASS") { throw "Smoke test failed: $out" }

      - name: Run model init smoke test
        shell: pwsh
        run: |
          $out = (python scripts/release/run_model_smoke.py --require-runtime | Select-Object -Last 1)
          if ($out -ne "MODEL_SMOKE:PASS") { throw "Model smoke failed: $out" }

      - name: Run segmentation workflow smoke test
        shell: pwsh
        run: |
          $out = (python scripts/release/run_segmentation_workflow_smoke.py | Select-Object -Last 1)
          if ($out -ne "SEGMENTATION_WORKFLOW_SMOKE:PASS") { throw "Workflow smoke failed: $out" }

      - name: Build Windows x64 app package
        shell: pwsh
        run: |
          $env:SWELL_BUILD_INSTALLER="${{ env.SWELL_ENABLE_UPDATER_ARTIFACTS }}"
          ./scripts/release/build_windows_app_x64.ps1

      - name: Run packaged app model runtime smoke test
        shell: pwsh
        run: |
          $out = (& "dist/windows-x64/Swell/Swell.exe" --smoke-test --smoke-model-runtime | Select-Object -Last 1)
          if ($out -ne "SMOKE_TEST:PASS") { throw "Packaged app smoke failed: $out" }

      - name: Run packaged app open-request smoke test
        shell: pwsh
        run: |
          $out = (python scripts/release/run_open_request_smoke.py --app-cmd "dist/windows-x64/Swell/Swell.exe" | Select-Object -Last 1)
          if ($out -ne "OPEN_REQUEST_SMOKE:PASS") { throw "Open request smoke failed: $out" }

      - name: Verify Windows package outputs
        shell: pwsh
        run: |
          if (!(Test-Path "dist/windows-x64/Swell")) { throw "missing dist/windows-x64/Swell" }
          if (!(Test-Path "dist/swell-windows-x64.zip")) { throw "missing dist/swell-windows-x64.zip" }
          if ("${{ env.SWELL_ENABLE_UPDATER_ARTIFACTS }}" -eq "true") {
            if (!(Get-ChildItem "dist/Swell-Setup-*.exe" -ErrorAction SilentlyContinue)) { throw "missing Windows installer" }
          }

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-validate.outputs.release_tag }}
        shell: pwsh
        run: |
          $files = @("dist/swell-windows-x64.zip")
          if ("${{ env.SWELL_ENABLE_UPDATER_ARTIFACTS }}" -eq "true") {
            $installers = Get-ChildItem "dist/Swell-Setup-*.exe" | ForEach-Object { $_.FullName }
            $files += $installers
          }
          gh release upload "$env:RELEASE_TAG" @files --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows release assets." }

  release-assemble:
    name: release-assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - release-validate
      - macos-arm64-package
      - windows-runtime-gate
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download packaged release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-validate.outputs.release_tag }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --dir dist \
            --pattern swell-macos-arm64.zip \
            --pattern swell-windows-x64.zip
          if [ "${SWELL_ENABLE_UPDATER_ARTIFACTS}" = "true" ]; then
            gh release download "$RELEASE_TAG" \
              --dir dist \
              --pattern swell-macos-arm64-signature.json \
              --pattern 'Swell-Setup-*.exe'
          fi
          ls -la dist

      - name: Generate compatibility manifest
        run: python scripts/release/generate_compatibility_manifest.py

      - name: Generate release notes from changelog
        run: |
          mkdir -p _release
          python scripts/release/generate_release_notes.py \
            --tag "${{ needs.release-validate.outputs.release_tag }}" \
            --output _release/release_notes.md

      - name: Generate updater appcasts
        if: env.SWELL_ENABLE_UPDATER_ARTIFACTS == 'true'
        run: |
          python scripts/release/generate_appcasts.py \
            --repo-root "${{ github.workspace }}" \
            --release-tag "${{ needs.release-validate.outputs.release_tag }}" \
            --github-repo "${{ github.repository }}"

      - name: Generate checksums
        run: ./scripts/release/generate_checksums.sh

      - name: Verify assembled release outputs
        run: |
          test -f dist/swell-macos-arm64.zip
          test -f dist/swell-windows-x64.zip
          if [ "${SWELL_ENABLE_UPDATER_ARTIFACTS}" = "true" ]; then
            test -f dist/swell-macos-arm64-signature.json
            ls dist/Swell-Setup-*.exe
            test -f dist/appcast-macos.xml
            test -f dist/appcast-windows.xml
          fi
          test -f dist/compatibility.json
          test -f dist/SHA256SUMS.txt
          test -f _release/release_notes.md

      - name: Upload release metadata and refresh draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-validate.outputs.release_tag }}
          IS_PRERELEASE: ${{ needs.release-validate.outputs.is_prerelease }}
        shell: bash
        run: |
          FILES=(dist/compatibility.json dist/SHA256SUMS.txt)
          if [ "${SWELL_ENABLE_UPDATER_ARTIFACTS}" = "true" ]; then
            FILES+=(dist/appcast-macos.xml dist/appcast-windows.xml)
          fi
          gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file _release/release_notes.md \
              --draft \
              --prerelease
          else
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file _release/release_notes.md \
              --draft \
              --prerelease=false
          fi

# macOS Apple Developer signing/notarization is intentionally deferred for now.
# Updater artifacts are intentionally disabled in the default tag workflow for now,
# and packaged macOS builds are still expected to trigger Gatekeeper warnings on end-user machines.
